<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeless Rescue & Management System - Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <!-- NGO Banner -->
    <div class="banner">
        <img src="{{ url_for('static', filename='Images/ngo_banner.jpg') }}" alt="Sabarmati NGO Banner">
    </div>

    <!-- Login Section -->
    <div class="container">

        <div class="right-panel">

            <div class="login-card">

                <h2>Sabarmathi Social Seva Sangam</h2>
                <p style="text-align:center; color:#666; margin-bottom:25px;">
                    Authorized User Login
                </p>

                <form id="loginForm" method="POST" action="{{ url_for('login') }}">

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter Username"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter Password"
                        required
                    >

                    <button type="submit">
                        Login
                    </button>

                    <br><br>

                    <p style="text-align:center;">
                        Don't have an account?
                        <a href="{{ url_for('register') }}">Register Here</a>
                    </p>

                    <p id="error-message"></p>

                    {% if error %}
                        <p class="server-error">{{ error }}</p>
                    {% endif %}

                </form>

            </div>

        </div>

    </div>

    <footer class="footer">
        © Sabarmathi Social Seva Sangam | Homeless Rescue & Management System
    </footer>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
