<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Persons | Sabarmati NGO</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/view_person.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🏠 Homeless Persons</h1>
        <p>View and manage rescued persons</p>
    </div>

    <div class="top-bar">

        <a href="{{ url_for('add_person') }}" class="add-btn">
            Add New Person
        </a>

        <input
            type="text"
            id="searchInput"
            placeholder="Search by Name...">

    </div>

    <table id="personsTable">

        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Location</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody>

        {% for person in persons %}

        <tr>

            <td>{{ person.name }}</td>
            <td>{{ person.age }}</td>
            <td>{{ person.gender }}</td>
            <td>{{ person.location }}</td>

            <td>
                <a href="{{ url_for('edit_person', id=person.id) }}" class="edit-btn">
                    Edit
                </a>
            </td>

            <td>
                <a href="{{ url_for('delete_person_route', id=person.id) }}"
                   class="delete-btn"
                   onclick="return confirm('Are you sure you want to delete this record?')">
                    Delete
                </a>
            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

    <br><br>

    <a href="{{ url_for('dashboard') }}" class="add-btn">
        Back to Dashboard
    </a>

</div>

<script src="{{ url_for('static', filename='js/view_persons.js') }}"></script>

</body>
</html>
