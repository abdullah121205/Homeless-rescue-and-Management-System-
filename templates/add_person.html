<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Homeless Person</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/add_person.css') }}">
</head>

<body>

<div class="container">

    <div class="form-container">

        <h1>Sabarmati NGO</h1>
        <h2>Homeless Rescue & Management System</h2>

        <form id="addPersonForm" method="POST" enctype="multipart/form-data">

            <!-- Personal Information -->
            <fieldset>
                <legend>Personal Information</legend>

                <label>Full Name *</label>
                <input type="text" name="full_name" placeholder="Enter Full Name" required>

                <label>Alias / Nickname</label>
                <input type="text" name="alias" placeholder="Enter Nickname">

                <label>Age *</label>
                <input type="number" name="age" min="1" max="120" placeholder="Enter Age" required>

                <label>Gender *</label>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </fieldset>

            <!-- Rescue Information -->
            <fieldset>
                <legend>Rescue Information</legend>

                <label>Rescue Date *</label>
                <input type="date" name="rescue_date" required>

                <label>Rescue Location *</label>
                <input type="text" name="location" placeholder="Enter Rescue Location" required>

                <label>Rescued By *</label>
                <input type="text" name="rescued_by" placeholder="Volunteer / Officer Name" required>
            </fieldset>

            <!-- Health Information -->
            <fieldset>
                <legend>Health Information</legend>

                <label>Physical Condition</label>
                <textarea name="physical_condition" rows="3" placeholder="Physical Condition"></textarea>

                <label>Medical Issues</label>
                <textarea name="medical_issues" rows="3" placeholder="Medical Issues"></textarea>

                <label>Disability Details</label>
                <input type="text" name="disability" placeholder="Disability Details">
            </fieldset>

            <!-- Identity Information -->
            <fieldset>
                <legend>Identity Information</legend>

                <label>Aadhaar Number</label>
                <input type="text" name="aadhaar" maxlength="12" placeholder="Enter Aadhaar Number">

                <label>Family Contact</label>
                <input type="text" name="family_contact" placeholder="Enter Contact Number">
            </fieldset>

            <!-- Additional Information -->
            <fieldset>
                <legend>Additional Information</legend>

                <label>Photo Upload</label>
                <input type="file" name="photo" accept="image/*">

                <label>Remarks</label>
                <textarea name="remarks" rows="4" placeholder="Additional Remarks"></textarea>
            </fieldset>

            <div class="button-group">
                <button type="submit" class="save-btn">💾 Save Record</button>
                <button type="reset" class="reset-btn">🔄 Reset</button>
            </div>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='js/add_person.js') }}"></script>

</body>
</html>
