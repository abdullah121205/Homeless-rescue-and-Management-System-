<!DOCTYPE html>
<html>
<head>
    <title>Add Homeless Person</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/add_person.css') }}">
</head>
<body>

<h2>Add Homeless Person</h2>

<form>

<h3>Personal Information</h3>

<label>Full Name:</label><br>
<input type="text"><br><br>

<label>Alias/Nickname:</label><br>
<input type="text"><br><br>

<label>Age:</label><br>
<input type="number"><br><br>

<label>Gender:</label><br>
<select>
    <option>Male</option>
    <option>Female</option>
    <option>Other</option>
</select>

<h3>Rescue Information</h3>

<label>Rescue Date:</label><br>
<input type="date"><br><br>

<label>Rescue Location:</label><br>
<input type="text"><br><br>

<label>Rescued By:</label><br>
<input type="text"><br><br>

<h3>Health Information</h3>

<label>Physical Condition:</label><br>
<textarea rows="3"></textarea><br><br>

<label>Medical Issues:</label><br>
<textarea rows="3"></textarea><br><br>

<label>Disability Details:</label><br>
<input type="text"><br><br>

<h3>Identity Information</h3>

<label>Aadhaar Number:</label><br>
<input type="text"><br><br>

<label>Family Contact:</label><br>
<input type="text"><br><br>

<h3>Additional Information</h3>

<label>Photo Upload:</label><br>
<input type="file"><br><br>

<label>Remarks:</label><br>
<textarea rows="4"></textarea><br><br>

<button type="submit">Save Record</button>
<button type="reset">Reset</button>

</form>
<script src="{{ url_for('static', filename='js/add_person.js') }}"></script>
</body>
</html>
