<!DOCTYPE html>
<html>
<head>
    <title>Homeless Persons List</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            padding:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ccc;
            padding:12px;
            text-align:center;
        }

        th{
            background:#3498db;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }

        h2{
            text-align:center;
        }

        a{
            text-decoration:none;
        }

        button{
            padding:10px 20px;
            background:#2ecc71;
            color:white;
            border:none;
            cursor:pointer;
        }
    </style>

</head>

<body>

<h2>Homeless Persons Details</h2>

<table>

<tr>
    <th>Name</th>
    <th>Age</th>
    <th>Gender</th>
    <th>Location Found</th>
</tr>

{% for person in persons %}

<tr>
    <td>{{ person.name }}</td>
    <td>{{ person.age }}</td>
    <td>{{ person.gender }}</td>
    <td>{{ person.location }}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/add_person">
<button>Add New Person</button>
</a>

</body>
</html>
