<!DOCTYPE html>
<html>
<head>
    <title>Homeless Persons List</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/view_persons.css') }}">

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            padding:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ccc;
            padding:12px;
            text-align:center;
        }

        th{
            background:#3498db;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }

        h2{
            text-align:center;
        }

        a{
            text-decoration:none;
        }

        button{
            padding:10px 20px;
            background:#2ecc71;
            color:white;
            border:none;
            cursor:pointer;
        }


        .edit-btn{
            background:#f39c12;
            margin-right:5px;
        }

        .delete-btn{
            background:#e74c3c;
        }

        #searchInput{
            width:300px;
            padding:10px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:5px;
        }
    </style>

</head>

<body>

<h2>Homeless Persons Details</h2>

<center>
    <input
        type="text"
        id="searchInput"
        placeholder="Search by Name...">
</center>

<br>

<table id="personsTable">

<tr>
    <th>Name</th>
    <th>Age</th>
    <th>Gender</th>
    <th>Location Found</th>

    
    <th>Edit</th>
    <th>Delete</th>
</tr>

{% for person in persons %}

<tr>
    <td>{{ person.name }}</td>
    <td>{{ person.age }}</td>
    <td>{{ person.gender }}</td>
    <td>{{ person.location }}</td>

    <td>
        <button class="edit-btn">Edit</button>
    </td>

    <td>
    <a href="/delete_person/{{ person.id }}"
       onclick="return confirm('Are you sure you want to delete this record?')">
        <button class="delete-btn">Delete</button>
    </a>
</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/add_person">
    <button>Add New Person</button>
</a>

<script src="{{ url_for('static', filename='js/view_persons.js') }}"></script>

</body>
</html>
