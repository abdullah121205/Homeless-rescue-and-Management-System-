<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Project</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/projects.css') }}">

</head>

<body>

<div class="container">

    <h2>Edit Project</h2>

    <form method="POST">

        <label>Project Name</label>
        <input type="text"
               name="project_name"
               value="{{ project.project_name }}"
               required>

        <label>Description</label>
        <textarea name="description" rows="4">{{ project.description }}</textarea>

        <label>Start Date</label>
        <input type="date"
               name="start_date"
               value="{{ project.start_date }}">

        <label>End Date</label>
        <input type="date"
               name="end_date"
               value="{{ project.end_date }}">

        <label>Location</label>
        <input type="text"
               name="location"
               value="{{ project.location }}">

        <label>Budget (₹)</label>
        <input type="number"
               name="budget"
               value="{{ project.budget }}">

        <label>Status</label>

        <select name="status">

            <option value="Active"
            {% if project.status == "Active" %}selected{% endif %}>
                Active
            </option>

            <option value="Completed"
            {% if project.status == "Completed" %}selected{% endif %}>
                Completed
            </option>

            <option value="On Hold"
            {% if project.status == "On Hold" %}selected{% endif %}>
                On Hold
            </option>

        </select>

        <button type="submit">
            Update Project
        </button>

    </form>

    <br>

    <a href="/projects">
        ← Back to Projects
    </a>

</div>

</body>

</html>
