<!DOCTYPE html>
<html>

<head>

<title>Edit Staff | Sabarmati NGO</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/staff.css') }}">

</head>


<body>


<div class="container">


<h2>Edit Staff Member</h2>


<form method="POST">


<label>Name</label>

<input 
type="text" 
name="name"
value="{{ staff.name }}"
required>


<label>Role</label>

<input 
type="text" 
name="role"
value="{{ staff.role }}"
required>


<label>Phone</label>

<input 
type="text" 
name="phone"
value="{{ staff.phone }}">


<label>Email</label>

<input 
type="email" 
name="email"
value="{{ staff.email }}">


<label>Joining Date</label>

<input 
type="date"
name="joining_date"
value="{{ staff.joining_date }}">


<label>Address</label>

<textarea name="address">{{ staff.address }}</textarea>


<button type="submit">

Update Staff

</button>


</form>


<br>

<a href="{{ url_for('staff') }}">

Back to Staff List

</a>


</div>


</body>

</html>
